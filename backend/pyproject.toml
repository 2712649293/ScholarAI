[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.5",
    "arxiv>=4.0.0",
    "chromadb>=1.5.9",
    "fastapi>=0.139.1",
    "langchain>=1.3.13",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.9",
    "pdfplumber>=0.11.10",
    "prometheus-client>=0.25.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
rag = []

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: 真实外部调用（LLM/arxiv/网络），默认跳过；跑用 pytest -m integration",
]

[tool.mypy]
# 关键：检查 async def 返回注解（防 None 被 FastAPI 序列化为 null JSON）
# ⚠️ 这个 flag 没了；用 disallow_incomplete_defs 替代——async def 没 return 会标 missing return statement
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["app"]
