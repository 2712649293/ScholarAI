# 前端 nginx 配置：
# 1. SPA fallback（所有非 /api 非 /assets 路径返 index.html，由 React Router 处理）
# 2. /api/* 反代到 backend 服务（在 docker network 中用服务名 backend:8000）
# 3. /metrics 透传（不缓存，Prometheus 抓取用）
# 4. SSE 研究流长连接支持（禁用缓冲，proxy_buffering off）

server {
    listen 80;
    server_name _;

    # nginx 默认 1MB，PDF 上传 50MB 会 413
    client_max_body_size 50m;

    # 让 nginx 不缓存 + 不缓冲（支持 SSE 流式响应）
    proxy_buffering off;
    proxy_cache off;
    # 兜底 900s：deep 模式研究可远超 300s（research_timeout_seconds 声而未用，后端无硬超时）
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # 反代后端（docker compose 服务名：backend）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus 指标透传（不缓存，Prometheus 抓取用）
    location /metrics {
        proxy_pass http://backend:8000;
    }

    # SPA fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
