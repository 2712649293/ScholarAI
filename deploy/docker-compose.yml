# ScholarAI 本地一键部署。
#
# 用法：
#   make docker-up    # 启
#   make docker-down  # 停
#   make docker-logs  # 看日志
#
# 运行与存储约束见 deploy/README.md。
# - 单 worker（嵌入式 Chroma 与 SQLite 检查点）
# - 不起独立 chroma 容器（嵌入式 PersistentClient 走 ./data/chroma/）
# - 仓库根目录 data/ 挂到容器内，持久化向量、PDF、报告、业务库和检查点

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: scholarai-backend:latest
    container_name: scholarai-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      # 容器内 Chroma 路径需指向挂载的 data/
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - PAPER_STORAGE_DIR=/app/data/papers
      - REPORTS_DIR=/app/data/reports
      - UPLOAD_DIR=/app/data/uploads
      - DATABASE_URL=sqlite:////app/data/scholarai.db
    volumes:
      - ../data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: scholarai-frontend:latest
    container_name: scholarai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy   # 等后端存活检查通过；不检查外部 LLM / embedding
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
